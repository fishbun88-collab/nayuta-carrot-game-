      "from": "su",
      "text": "유타야, 잠깐 시간 있어?"
    },
    {
      "from": "yuta",
      "text": "응,,, 왜?"
    },
    {
      "from": "su",
      "text": "너 사람 만나기 힘들어하니까. 아예 사람을 만날 수밖에 없는 환경을 만들어보면 어떨까?"
    },
    {
      "from": "su",
      "text": "어차피 집에 정리해야 될 물건도 많다고 했고..."
    },
    {
      "from": "su",
      "text": "당근이라는 어플 알지? 직거래하는 거."
    },
    {
      "from": "yuta",
      "text": "응,,, 깔려져 있긴 한데,,,"
    },
    {
      "from": "su",
      "text": "거기에 물건을 올려서 팔아보면 어떨까?"
    },
    {
      "from": "su",
      "text": "너 어차피 물건 정리해야 된다고도 했고..."
    },
    {
      "from": "su",
      "text": "먼저 글부터 올려봐 ㅎㅎ"
    },
    {
      "from": "su",
      "text": "혹시 너무 힘들면 내가 도와줄게"
    },
    {
      "from": "yuta",
      "text": "직접 사람을 만나는 건 좀 무서운데... 일단 해볼게."
    },
    {
      "from": "su",
      "text": "그거면 충분하지. 천천히 해, 유타."
    }
  ],

<script>

const DATA=window.SIM_DATA;
if(!DATA){document.getElementById('screen').textContent='game-data.js를 불러오지 못했어요.';return;}
const $=(id)=>document.getElementById(id);
const KEY='nayuta-carrot-sim-v2';
const PREVIOUS_KEY='nayuta-carrot-sim-v1';
const starter=()=>({screen:'lock',introSeen:false,posted:false,itemReturn:'carrot',tab:'home',activeItem:null,activeBuyer:null,level:0,threads:{},seenThreads:[],hintIds:[],hintNotes:[],hintFrom:null,overrides:{},showToastOnce:false});
let s=starter();
try{
 const raw=localStorage.getItem(KEY);
 if(raw){s={...s,...JSON.parse(raw)};if(!s.threads)s.threads={};if(!s.overrides)s.overrides={};if(!s.hintIds)s.hintIds=[];if(!s.hintNotes)s.hintNotes=[];}
 else { // Old progress cannot match new rounds; preserve only edited profile/item photos.
   const prior=JSON.parse(localStorage.getItem(PREVIOUS_KEY)||'null');
   if(prior && prior.overrides && typeof prior.overrides==='object') s.overrides=prior.overrides;
 }
}catch(e){console.warn('저장된 데이터를 열 수 없습니다',e)}
let toastTimer=null;
const esc=(v)=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const money=n=>Number(n).toLocaleString('ko-KR')+'원';
const getItem=id=>DATA.items.find(x=>x.id===id);
const getBuyer=id=>DATA.buyers.find(x=>x.id===id);
const imageFor=(obj)=>s.overrides[(obj.profile?'profile:':'item:')+obj.id]||(obj.profile||obj.photo);
const ordered=()=>DATA.buyers.filter((b,i)=>i<=s.level*2+1 && s.posted);
const wins=()=>Object.values(s.threads).filter(t=>t.finished&&t.success).length;
const completed=()=>Object.values(s.threads).filter(t=>t.finished).length;
const leftHints=()=>DATA.settings.hints-s.hintIds.length;
const stageComplete=()=>s.posted&&DATA.buyers.slice(s.level*2,s.level*2+2).every(b=>s.threads[b.id]?.finished);
const fullComplete=()=>completed()===DATA.buyers.length;
const unreads=()=>ordered().filter(b=>!s.seenThreads.includes(b.id)&&!s.threads[b.id]?.finished).length;
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){console.warn('저장 공간이 부족합니다',e)}}
function notify(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2900)}
function statusBar(){const dark=['lock','home'].includes(s.screen);$('status-bar').className='status-bar'+(dark?' dark':'');$('status-bar').innerHTML='<span class="status-time">9:41</span><span class="dynamic-island"></span><span class="status-signals">▂▅▇ ᯤ <span class="battery">100</span></span>';$('home-bar').className='home-indicator'+(dark?' light':'')}
function lock(){let now=new Date();return `<div class="ios-wallpaper"><div class="lock-content"><div class="lock-label">${now.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}</div><div class="lock-clock">9:41</div></div><button type="button" class="lock-note" data-act="unlock"><span class="lock-noticon">💬</span><span><b>카카오톡 · 수 <span style="float:right;font-size:10px;color:#5c7080">지금</span></b><small>유타야, 잠깐 시간 있어?<br>생각해둔 게 있는데…</small></span></button><div class="lock-footer"><span>⌃</span><button class="lock-unlock" data-act="unlock">위로 쓸어올려 잠금 해제</button></div></div>`}
function appTile(key,symbol,name,cls='',badge=false){return `<button class="app-tile" data-act="launch:${key}" aria-label="${esc(name)} 열기"><span class="app-icon ${cls}">${symbol}${badge?'<i class="notif">'+(unreads()||1)+'</i>':''}</span><span>${esc(name)}</span></button>`}
function home(){let now=new Date();return `<div class="ios-wallpaper home-screen"><div class="ios-home-widgets"><div class="home-widget"><small>${now.toLocaleDateString('ko-KR',{month:'long',weekday:'long'})}</small><div class="day">${now.getDate()}</div><div class="muted">일정 없음</div></div><div class="home-widget weather-widget"><small>날씨</small><div class="cloud">☁️</div><div class="dash">--°</div><div class="muted">날씨 데이터 없음</div></div></div><div class="app-grid">${appTile('gallery','🌈','사진','photos')}${appTile('calendar','📅','캘린더','calendar')}${appTile('notes','🗒️','메모','notes')}${appTile('clock','🕓','시계','clock')}${appTile('weather','🌤️','날씨','')}${appTile('settings','⚙️','설정','settings')}${appTile('carrot','🥕','당근','carrot',s.posted)}${appTile('kakao','💬','카카오톡','kakao')}</div><div class="ios-pages">● ○</div><div class="ios-search">⌕ 검색</div><div class="ios-dock">${appTile('phone','☎','전화','phone')}${appTile('messages','💬','메시지','messages')}${appTile('kakao','💬','카카오톡','kakao')}${appTile('carrot','🥕','당근','carrot')}</div></div>`}

function timeOf(i){return '09:'+String(41+Math.floor(i/3)).padStart(2,'0')}
function header(title,back='',right=''){return `<div class="app-header"><div class="head-left">${back?backBtn(back):''}<h2>${title}</h2></div><div class="head-right">${right}</div></div>`}
function nav(){return `<nav class="nav-tabs">${[['home','⌂','홈'],['chats','▤','채팅'],['mine','♙','나의 당근']].map(([id,sym,name])=>`<button class="nav-tab ${s.tab===id?'selected':''}" data-act="tab:${id}"><span class="nav-symbol">${sym}${id==='chats'&&unreads()?`<i class="count">${unreads()}</i>`:''}</span><span>${name}</span></button>`).join('')}</nav>`}
function listingRow(item){let b=DATA.buyers.find(x=>x.itemId===item.id);let t=s.threads[b?.id];return `<button class="feed-item" data-act="item:${esc(item.id)}"><img src="${esc(imageFor(item))}" alt="${esc(item.title)} 사진"><div class="description"><b>${esc(item.title)}</b><small>우리 동네 · 방금 전</small><strong>${money(item.price)}</strong>${t?.finished?`<span class="status-tag ${t.success?'sold':'waiting'}">${t.success?'거래완료':'판매중'}</span>`:''}<span class="tiny-activity">♡ ${1+DATA.items.indexOf(item)}　☏ ${t?1:0}</span></div></button>`}
function feed(){return s.posted?`<div class="feed-intro">나유타의 판매 물건 · 총 ${DATA.items.length}개</div><div class="feed-items">${DATA.items.map(listingRow).join('')}</div>`:`<div class="empty-start"><span class="illustration">📦</span><h2>서랍에 잠든 물건들</h2><p>수는 먼저 글부터 올려보라고 했다.<br>내 방에 물건이 이렇게 많았던가…<br><br>글쓰기를 눌러 8개의 판매글을<br>자동으로 작성해 보자.</p><button class="primary-action" data-act="compose">+ 내 물건 팔기</button></div>`}
function chats(){if(!s.posted)return `<div class="empty-start"><span class="illustration">💬</span><h2>아직 채팅이 없어요</h2><p>판매글을 올리면 구매 희망자들이<br>연락을 보낼지도 몰라요.</p><button class="primary-action" data-act="compose">판매글 쓰기</button></div>`;return `<div style="padding:13px 16px;font-size:11px;color:#8b9097;border-bottom:1px solid #f3f3f3">${esc(DATA.waveLabels[s.level])} · 완료 ${completed()} / 8 · 성공 ${wins()}</div>${ordered().map(b=>{let t=s.threads[b.id];let item=getItem(b.itemId);let msg=t?.messages.at(-1)?.text||b.steps[0].buyer;return `<button class="chat-list-row" data-act="thread:${b.id}"><img class="avatar" src="${esc(imageFor(b))}" alt="${esc(b.nick)} 프로필"><div class="left"><div class="rowhead"><b>${esc(b.nick)}</b><small>우리 동네</small>${t.finished?`<span class="status-tag ${t.success?'sold':''}">${t.success?'완료':'종료'}</span>`:''}</div><div class="preview">${esc(msg)}</div></div>${!s.seenThreads.includes(b.id)&&!t.finished?'<span class="unread">1</span>':''}<img class="product-thumb" src="${esc(imageFor(item))}" alt=""></button>`}).join('')}${stageComplete()?`<div style="padding:18px"><button class="primary-action" data-act="stage">${fullComplete()?'최종 결과 보기':'이번 두 사람 결과 보기'}</button></div>`:''}`}
function mine(){return `<div class="my-section"><div class="my-profile"><span class="avatar">🍁</span><div><b>${esc(DATA.ownerNick)}</b><p>나유타 · 우리 동네<br>처음 해보는 직거래… 괜찮을까?</p></div></div><div class="my-stats"><div><strong>${s.posted?8:0}</strong><small>등록한 물건</small></div><div><strong>${completed()}</strong><small>시도한 거래</small></div><div><strong>${wins()}</strong><small>거래 성공</small></div><div><strong>${leftHints()}</strong><small>남은 수의 도움</small></div></div></div><div class="my-menu"><button data-act="editor">🖼️ 프로필·물품 사진 바꾸기 <span>›</span></button><button data-act="kakao">🐬 수와의 카톡 다시 보기 <span>›</span></button>${stageComplete()?'<button data-act="stage">📊 현재 결과 확인 <span>›</span></button>':''}<button data-act="restart">↻ 게임 처음부터 다시 시작 <span>›</span></button></div><div class="editor-hint">이 앱은 가상 캐릭터 시뮬레이터입니다. 실제 당근 거래나 사용자와 연결되지 않아요.</div>`}

function compose(){return `<div class="app-screen">${header('내 물건 팔기','carrot')}<div class="app-body"><div class="compose-headline"><div class="tiny-capsule" style="display:inline-block">✨ 자동으로 채워진 초안</div><h2>8개 판매글이 준비됐어요</h2><p>유타의 방을 정리하며 찾은 물건들.<br>제목·가격·상세 설명까지 작성해 두었어요.</p></div>${DATA.items.map(item=>`<div class="compose-card"><img src="${esc(imageFor(item))}" alt="${esc(item.title)}"><div class="info"><b>${esc(item.title)}</b><small>${esc(item.category)}　·　${money(item.price)}</small><p>${esc(item.description)}</p></div></div>`).join('')}</div><div class="compose-footer"><button class="primary-action" data-act="publish" ${s.posted?'disabled':''}>${s.posted?'이미 8개를 게시했어요':'🥕 판매글 8개 모두 게시하기'}</button></div></div>`}

function threadStart(id){const b=getBuyer(id);if(!b)return;if(!s.threads[id])s.threads[id]={index:0,score:0,messages:[{from:'buyer',text:b.steps[0].buyer}],finished:false,success:false};}
function threadPage(){let b=getBuyer(s.activeBuyer);if(!b)return carrot();let item=getItem(b.itemId);let t=s.threads[b.id];if(!t){threadStart(b.id);t=s.threads[b.id]}
let history=t.messages.map((m,i)=>`<div class="chat-bub-row ${m.from==='buyer'?'buyer':'me'}">${m.from==='buyer'?`<img class="avatar" src="${esc(imageFor(b))}" alt="">`:''}<div class="chat-bubble">${esc(m.text)}</div><span class="chat-time">${chatTime(i)}</span></div>`).join('');let activeStep=b.steps[t.index];let choicePanel=t.finished?`<div class="chat-result"><div class="result-line">${t.success?'🎉 거래 성사':'🌥️ 거래 불발'}　<strong>${t.score} / 10점</strong> · 기준 ${DATA.settings.scorePerBuyer}점</div><button class="primary-action" data-act="thread-close">${stageComplete()?'이번 두 사람 결과 보기':'채팅 목록으로'}</button></div>`:`<div class="chat-choices"><div class="choice-label"><span>유타의 답장을 골라 주세요</span><span>${t.index+1} / 10번째 선택</span></div>${activeStep.options.map((o,k)=>`<button class="choice-btn" data-act="choice:${b.id}:${k}"><span class="letter">${String.fromCharCode(65+k)}</span><span>${esc(o.text)}</span></button>`).join('')}</div>`;
return `<div class="chat-screen"><div class="chat-room-head">${backBtn('carrot-chats')}<div class="name"><b>${esc(b.nick)}</b><small>우리 동네 · 이웃과의 대화</small></div><button class="hint-button" data-act="hint:${b.id}" aria-label="수의 조언 받기">🐬🔎<span class="hint-count">${leftHints()}</span></button><button class="icon-btn" data-act="item:${esc(item.id)}" aria-label="상품 보기">⋯</button></div><div class="chat-product"><img src="${esc(imageFor(item))}" alt="${esc(item.title)}"><div><span class="line1"><b>${t.success?'거래완료':'판매중'}</b> · ${esc(item.title)}</span><strong>${money(item.price)}</strong></div><span class="step-count">${String(Math.min(t.index+1,10)).padStart(2,'0')} / 10</span></div><div class="chat-messages" id="chat-scroller"><div class="room-day">오늘 · 우리 동네 이웃과 채팅</div>${history}</div>${choicePanel}</div>`}
function chatTime(i){return '오후 '+(1+Math.floor(i/19))+':'+String((i*3)%60).padStart(2,'0')}
function stagePage(){let pair=DATA.buyers.slice(s.level*2,s.level*2+2);let final=fullComplete();let sum=pair.filter(b=>s.threads[b.id]?.success).length;return `<div class="wave-page"><div class="wave-emoji">${final?'🎓':sum===2?'🥕':'📦'}</div><h1>${final?'여덟 번의 대화가 끝났다':`두 사람과의 거래가 끝났다`}</h1><p class="sub">${final?'나유타의 첫 거래 도전, 그 결과는?':`이번 단계 · ${esc(DATA.waveLabels[s.level])}<br>처음에는 답장 버튼 하나 누르기도 긴장됐지만…`}</p>${pair.map(b=>{let t=s.threads[b.id];return `<div class="wave-result-card ${t?.success?'success':'fail'}"><b>${t?.success?'✔ 거래 성공':'✕ 거래 불발'}　${esc(b.nick)}</b><span>신뢰 점수 <b style="display:inline">${t?.score??0} / 10점</b><br>${t?.success?'구매 의사를 받았어요.':'상대가 구매를 보류했어요.'}</span></div>`}).join('')}<div class="wave-spacer"></div><div><p class="sub" style="margin-bottom:12px">누적 성공 ${wins()} / 8 · 목표 ${DATA.settings.neededWins}명</p><div class="progress-track"><i style="width:${wins()/DATA.settings.neededWins*100}%"></i></div></div><button class="primary-action" data-act="${final?'ending':'next-stage'}">${final?'최종 결과 확인하기':'다음 두 사람의 메시지 확인하기 →'}</button><button class="secondary-action" data-act="carrot-chats">채팅 목록으로</button></div>`}
function endingPage(){let won=wins()>=DATA.settings.neededWins,perfect=wins()===8;let used=s.hintIds.length;return `<div class="wave-page" style="padding-top:73px"><div class="wave-emoji">${won?'🌼':'🌙'}</div><div style="text-align:center;color:#ed811c;font-size:11px;font-weight:780;letter-spacing:2px">${won?'CLEAR':'TRY AGAIN'}</div><h1>${won?(perfect?'모두에게 답장을 보냈다':'조금은 익숙해진 인사'):'내일도 괜찮을 거야'}</h1><p class="sub">${won?'막상 사람들과 대화해 보니, 말 한마디를 고르는 일은 생각보다 어렵고, 또 생각보다 괜찮았다.':'여덟 번 중 마음이 닿지 않은 순간도 있었다. 그래도 유타는 도망치지 않고 끝까지 답장을 보냈다.'}</p><div class="wave-result-card success" style="text-align:center"><b style="font-size:25px;margin-bottom:4px">${wins()} / 8명 성공</b><span>목표: ${DATA.settings.neededWins}명 성공　|　수에게 도움 요청: ${used} / ${DATA.settings.hints}회</span></div><div class="wave-result-card"><b>🐬 수 · 카카오톡</b><span>${won?'봐. 너 생각보다 잘하잖아 ㅎㅎ\n다음엔 나랑 같이 나가볼래?':'안 되는 날도 있는 거지.\n그래도 끝까지 한 거, 나는 되게 멋지다고 생각해.'}</span></div><p class="sub" style="font-size:12px">며칠 뒤, 학교 복도에서 낯익은 물건들이 눈에 들어왔다.<br>하지만 유타는 아직 모른다.<br>채팅창 저편에 있던 사람들도 같은 학교 학생이었다는 걸.</p><details class="spoilers"><summary>🔎 제작자용 · 구매자 정체 보기 (스포일러)</summary>${DATA.buyers.map(b=>`<p>${esc(b.nick)} → ${esc(b.name)} · ${esc(b.difficulty)}</p>`).join('')}</details><div class="wave-spacer"></div><button class="primary-action" data-act="carrot-chats">채팅 기록 다시 보기</button><button class="secondary-action" data-act="restart">처음부터 다시 플레이</button></div>`}
function editorPage(){let characters=DATA.buyers.map(b=>`<div class="editor-row"><img src="${esc(imageFor(b))}" alt=""><div><b>${esc(b.nick)}</b><small>구매자 프로필 · 사진 변경 가능</small></div><label class="upload-label">사진 교체<input type="file" accept="image/*" data-file="profile:${esc(b.id)}"></label></div>`).join('');let items=DATA.items.map(x=>`<div class="editor-row"><img src="${esc(imageFor(x))}" alt=""><div><b>${esc(x.title)}</b><small>${money(x.price)}</small></div><label class="upload-label">사진 교체<input type="file" accept="image/*" data-file="item:${esc(x.id)}"></label></div>`).join('');return `<div class="app-screen">${header('사진 바꾸기','carrot-mine')}<div class="app-body"><div class="editor-head">사진을 선택하면 이 브라우저의 게임 화면에 즉시 적용돼요. 친구에게 공유할 최종 사진은 ZIP 내부 <b>assets</b> 파일을 교체하거나 <b>game-data.js</b>의 사진 경로를 수정하세요.</div><div class="editor-section"><h3>구매자 프로필 사진 · 8명</h3>${characters}</div><div class="editor-section"><h3>판매 물품 사진 · 8개</h3>${items}</div><div class="editor-hint">지원 파일: JPG, PNG, WEBP 등 · 사진은 자동 축소하여 브라우저에 저장합니다. 브라우저 저장 기록을 삭제하면 교체한 사진도 초기화돼요.</div><div style="padding:0 18px 40px"><button class="secondary-action" data-act="reset-pictures">내가 교체한 사진만 초기화</button></div></div></div>`}
function render(){const screen=$('screen');const views={lock,home,kakao,carrot,compose,listing:itemPage,thread:threadPage,stage:stagePage,ending:endingPage,editor:editorPage};screen.innerHTML=(views[s.screen]||home)();statusBar();save();requestAnimationFrame(()=>{let target=s.screen==='thread'?'chat-scroller':s.screen==='kakao'?'kakao-scroller':null;if(target){let el=$(target);if(el)el.scrollTop=(s.screen==='kakao'&&!s.posted&&!s.hintNotes.length)?0:el.scrollHeight}})}
function goHome(){s.screen='home';s.hintFrom=null;render()}
function openKakao(){s.screen='kakao';render()}
function openCarrot(tab){s.screen='carrot';s.tab=tab||s.tab||'home';s.hintFrom=null;render()}
function openThread(id){if(!s.posted)return;let b=getBuyer(id);if(!b||!ordered().some(x=>x.id===id))return;threadStart(id);s.activeBuyer=id;s.screen='thread';if(!s.seenThreads.includes(id))s.seenThreads.push(id);render()}
function publish(){if(s.posted){notify('이미 판매글 8개를 올렸어요');return}s.posted=true;s.level=0;for(const b of DATA.buyers.slice(0,2))threadStart(b.id);s.tab='chats';s.screen='carrot';render();notify('8개의 판매글을 올렸어요! 새로운 채팅 2건이 도착했어요 🥕')}
function choose(bid,index){let b=getBuyer(bid),t=s.threads[bid];if(!b||!t||t.finished||s.activeBuyer!==bid)return;let step=b.steps[t.index],opt=step?.options[index];if(!opt)return;t.messages.push({from:'me',text:opt.text});t.score+=Number(opt.point||0);t.index+=1;t.messages.push({from:'buyer',text:opt.reply});if(t.index>=b.steps.length){t.finished=true;t.success=t.score>=DATA.settings.scorePerBuyer;t.messages.push({from:'buyer',text:t.success?b.endOk:b.endNo})}else{t.messages.push({from:'buyer',text:b.steps[t.index].buyer})}render()}
function hint(id){const b=getBuyer(id),t=s.threads[id];if(!b||!t||t.finished){notify('이미 종료된 거래예요.');return}if(s.hintIds.includes(id)){s.hintFrom=id;s.screen='kakao';render();notify('이 상대에 대한 조언을 다시 볼 수 있어요.');return}if(leftHints()<=0){notify('수에게 도움을 요청할 기회 3번을 모두 썼어요.');return}let ask=`수, 당근에서 '${b.nick}'이라는 사람이랑 대화 중인데…\n${b.summary.replace('[임시 설정] ','')}\n이런 성격인 것 같아. 도대체 어떻게 해야 될까...`;
s.hintIds.push(id);s.hintNotes.push({buyerId:id,ask,answer:b.hint});s.hintFrom=id;s.screen='kakao';render()}
function nextStage(){if(!stageComplete()||fullComplete())return;s.level++;for(const b of DATA.buyers.slice(s.level*2,s.level*2+2))threadStart(b.id);s.screen='carrot';s.tab='chats';render();notify('새로운 구매자 2명에게서 메시지가 도착했어요!')}
function restart(){if(!confirm('현재 거래 기록을 모두 지우고 처음부터 시작할까요? (교체한 사진은 유지돼요)'))return;let overrides={...s.overrides};s=starter();s.overrides=overrides;render();notify('새 게임을 시작했어요')}
function fileChanged(input){const file=input.files?.[0],key=input.dataset.file;if(!file||!key)return;if(!file.type.startsWith('image/')){notify('이미지 파일을 선택해주세요.');return}if(file.size>12*1024*1024){notify('12MB 이하 이미지를 골라주세요.');return}const fr=new FileReader();fr.onerror=()=>notify('사진을 읽지 못했어요.');fr.onload=()=>{let im=new Image();im.onerror=()=>notify('이미지 형식을 읽을 수 없어요.');im.onload=()=>{let max=key.startsWith('profile:')?400:650,scale=Math.min(1,max/Math.max(im.width,im.height));let cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*scale));cv.height=Math.max(1,Math.round(im.height*scale));let ctx=cv.getContext('2d');ctx.drawImage(im,0,0,cv.width,cv.height);s.overrides[key]=cv.toDataURL('image/jpeg',.76);try{save()}catch(e){}render();notify('사진을 교체했어요.');};im.src=fr.result;};fr.readAsDataURL(file)}
document.addEventListener('change',e=>{if(e.target.matches('input[type=file][data-file]'))fileChanged(e.target)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const val=b.dataset.act;if(!val)return;
 if(val==='unlock'){s.introSeen=true;s.screen='kakao';render();return}
 if(val==='home'){goHome();return}
 if(val==='kakao'){openKakao();return}
 if(val==='carrot'){openCarrot('home');return}
 if(val==='carrot-chats'){openCarrot('chats');return}
 if(val==='carrot-mine'){openCarrot('mine');return}
 if(val==='back-item'){if(s.itemReturn==='thread'&&s.activeBuyer){s.screen='thread';render()}else openCarrot('home');return}
 if(val==='return-thread'){let id=s.hintFrom;s.hintFrom=null;id?openThread(id):openCarrot('chats');return}
 if(val==='compose'){s.screen='compose';render();return}
 if(val==='publish'){publish();return}
 if(val==='stage'){if(stageComplete()){s.screen='stage';render()}return}
 if(val==='next-stage'){nextStage();return}
 if(val==='ending'){s.screen='ending';render();return}
 if(val==='thread-close'){if(stageComplete()){s.screen='stage';render()}else openCarrot('chats');return}
 if(val==='editor'){s.screen='editor';render();return}
 if(val==='restart'){restart();return}
 if(val==='reset-pictures'){if(!confirm('바꿨던 사진을 기본 이미지로 되돌릴까요?'))return;s.overrides={};render();notify('기본 사진으로 되돌렸어요');return}
 if(val.startsWith('launch:')){let app=val.slice(7);if(app==='kakao')openKakao();else if(app==='carrot')openCarrot('home');else if(app==='settings') {openCarrot('mine');notify('게임 설정은 나의 당근에서 이용할 수 있어요.')} else notify('이번 이야기에서는 카톡과 당근 앱을 사용해요.');return}
 if(val.startsWith('tab:')){openCarrot(val.slice(4));return}
 if(val.startsWith('item:')){s.itemReturn=s.screen==='thread'?'thread':'carrot';s.activeItem=val.slice(5);s.screen='listing';render();return}
 if(val.startsWith('thread:')){openThread(val.slice(7));return}
 if(val.startsWith('hint:')){hint(val.slice(5));return}
 if(val.startsWith('choice:')){const [,id,num]=val.split(':');choose(id,Number(num));return}
});
// Give the author a safe, read-only quick verification helper in the JS console.
window.SIM_VERIFY=()=>({buyers:DATA.buyers.length,questions:DATA.buyers.map(b=>[b.nick,b.steps.length]),completed:completed(),wins:wins(),hintsLeft:leftHints()});
render();
})();

</script>
</body>
</html>
